# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Для stateless API сессии не нужны
    session: false

    #esi: true
    #fragments: true

    http_method_override: true
    default_locale: ru

    # PHP errors logging
    php_errors:
        log: true

    # Assets configuration
    assets:
        # Используем json_manifest_path для production assets
        # или закомментируйте эту секцию, если assets не используются
        json_manifest_path: '%kernel.project_dir%/public/build/manifest.json'

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
